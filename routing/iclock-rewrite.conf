# ═══════════════════════════════════════════════════════════════════════════
#  ZKTeco ADMS path rewrite:  /iclock/*  ->  /webhook/iclock/*
#
#  TWO WAYS TO USE THIS FILE
#
#  (A) As a rule added to the existing edge proxy in front of
#      automations.example.org. Take only the `location /iclock/` block
#      and drop it into the existing server block. This is the preferred
#      route - no new hardware. See routing/README.md, Option 2.
#
#  (B) As a standalone middlebox on a cloud VM or Raspberry Pi, if the proxy
#      team won't add the rule. Use the whole file. See Option 3.
#
#  WHY IT'S NEEDED
#  The terminal has "/iclock/cdata" burned into its firmware and offers no
#  setting to add a prefix. n8n serves webhooks under "/webhook/". Renaming
#  n8n's prefix via N8N_ENDPOINT_WEBHOOK is instance-global and would break
#  the URL of every other workflow on that shared instance - so the rewrite
#  has to happen in front of n8n, not inside it.
# ═══════════════════════════════════════════════════════════════════════════


# ── For use (A): this is the only block that matters ───────────────────────
# Add inside the existing server block for automations.example.org, and
# make sure it is exempt from the OAuth redirect in the same way /webhook/
# already is.
#
#     location /iclock/ {
#         rewrite ^/iclock/(.*)$ /webhook/iclock/$1 last;
#     }
#
# `last` re-runs location matching so the request lands on the existing
# /webhook/ handling with all its current settings. Nothing else changes.


# ── For use (B): standalone middlebox ──────────────────────────────────────

upstream n8n_upstream {
    server automations.example.org:443;
    keepalive 8;
}

server {
    # Plain HTTP on the device side. This is the entire reason the middlebox
    # exists when the terminal can't do TLS: it terminates HTTP here and
    # speaks HTTPS onward.
    listen 8080;
    server_name _;

    # Lock to the network the terminal is on. Nothing else should reach this.
    # Replace with the terminal's actual subnet.
    allow 10.143.69.0/24;
    allow 192.168.0.0/16;
    deny  all;

    access_log /var/log/nginx/iclock_access.log;
    error_log  /var/log/nginx/iclock_error.log warn;

    # Fingerprint template batches are the biggest payload the device sends.
    client_max_body_size 16m;

    # The far end is a workflow engine talking to a Snowflake warehouse that
    # may need to resume from suspend. A cold first query can take 10s+.
    # Timing out here makes the device re-send the whole batch.
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    proxy_connect_timeout 15s;

    location /iclock/ {
        rewrite ^/iclock/(.*)$ /webhook/iclock/$1 break;

        proxy_pass            https://n8n_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        automations.example.org;
        proxy_http_version    1.1;

        proxy_set_header Host              automations.example.org;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        # The shared secret the terminal cannot send for itself. Pair this
        # with Header Auth on the n8n Webhook nodes. Only meaningful in
        # setup (B) - in setup (A) there is no middlebox to hold a secret,
        # so rely on the IP allowlist instead.
        proxy_set_header X-ADMS-Key        "REPLACE_WITH_LONG_RANDOM_SECRET";

        # The device holds the connection open waiting for its "OK". Don't
        # let nginx sit on the response.
        proxy_buffering off;
    }

    # For your own monitoring. The device never calls this.
    location = /relay-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "relay ok\n";
    }

    location / { return 404; }
}

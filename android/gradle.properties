android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# org.gradle.jvmargs is deliberately NOT set here.
#
# This laptop blocks AF_UNIX sockets anywhere under %LOCALAPPDATA%, which is
# where the JVM places the auto-bound socket backing Selector.open(). The Gradle
# daemon dies on startup with "Unable to establish loopback connection" unless
# it is started with -Djdk.net.unixdomain.tmpdir pointing outside AppData.
#
# That path is machine-specific, so it lives in the per-user file
# (~/.gradle/gradle.properties) rather than here. A project-level
# org.gradle.jvmargs would override the user-level one and reintroduce the
# failure - which is exactly what happened the first time.
